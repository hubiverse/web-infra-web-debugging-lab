<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Level 10 · Your Cart</title>
  <link rel="stylesheet" href="/shared/style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="level-header">
    <div class="inner"><span class="level-number">Level 10</span><span class="level-name">Almost the Right Total</span></div>
  </header>
  <main>
    <h1>Your Cart</h1>
    <div id="message" class="error"></div>
    <ul id="cart-lines" class="list"></ul>
    <div class="card totals">
      <div class="row"><span>Subtotal</span><span id="subtotal"></span></div>
      <div class="row"><span>Shipping</span><span id="shipping"></span></div>
      <div class="row total"><span>Total</span><span id="total"></span></div>
    </div>
  </main>
</body>
</html>
