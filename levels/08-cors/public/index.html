<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Level 08 · Weather</title>
  <link rel="stylesheet" href="/shared/style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="level-header">
    <div class="inner"><span class="level-number">Level 08</span><span class="level-name">Works in Python, Fails in the Browser</span></div>
  </header>
  <main>
    <h1>Weather</h1>
    <p class="subtitle">Live data from <a href="https://open-meteo.com/">Open-Meteo</a>.</p>
    <p>
      <label for="city">City</label>
      <select id="city">
        <option value="Kigali">Kigali</option>
        <option value="Accra">Accra</option>
        <option value="Lagos">Lagos</option>
      </select>
    </p>
    <div id="message" class="error"></div>
    <div id="weather" class="card weather"></div>
  </main>
</body>
</html>
